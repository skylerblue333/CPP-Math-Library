name: math-ci

on:
  push:
    branches: [main, "product/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Tests
        run: ctest --test-dir build --output-on-failure
      - name: Demo smoke test
        run: ./build/sky-math-demo
      - name: Sanitizer verification
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          cmake --build build-asan --parallel 2
          ctest --test-dir build-asan --output-on-failure
      - name: Build image
        run: docker build -t sky-math:${{ github.sha }} .
      - name: Verify non-root image
        run: test "$(docker image inspect sky-math:${{ github.sha }} --format '{{.Config.User}}')" = "10001:10001"
      - name: Container smoke test
        run: docker run --rm sky-math:${{ github.sha }}
