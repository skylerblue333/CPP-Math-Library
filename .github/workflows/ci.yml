name: math-core-ci

on:
  push:
    branches: [main, "product/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Release build and tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          ./build/app | grep -q 'dot=32'
      - name: Sanitizer build and tests
        run: |
          cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          cmake --build build-sanitized --parallel 2
          ASAN_OPTIONS=detect_leaks=1 ctest --test-dir build-sanitized --output-on-failure
      - name: Build image
        run: docker build -t sky-math-core:ci .
      - name: Verify non-root image and demo
        run: |
          user="$(docker image inspect sky-math-core:ci --format '{{.Config.User}}')"
          test -n "$user"
          test "$user" != "0"
          test "$user" != "root"
          docker run --rm sky-math-core:ci | grep -q 'dot=32'
